name: Build TeleReport APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "telegram.api_id=${{ secrets.API_ID }}" >> local.properties
        echo "telegram.api_hash=${{ secrets.API_HASH }}" >> local.properties
        echo "tele.channel_id=-1002617482597" >> local.properties

    - name: Build with Gradle
      run: ./gradlew assembleUniversalRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tele-report-apk
        path: app/build/outputs/apk/universal/release/*.apk
        retention-days: 1 # حذف خودکار بعد از یک روز
