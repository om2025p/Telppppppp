name: Android CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        echo "telegram.api_id=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
        echo "telegram.api_hash=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
        echo "app.disable_signing=true" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleUniversalRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TeleSync-APK
        path: app/build/outputs/apk/universal/release/*.apk
        retention-days: 1
